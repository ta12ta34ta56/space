<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Novelka — build print-ready puzzle and low-content books for Amazon KDP." />
    <title>Novelka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      /* Set the theme BEFORE the stylesheet paints.
         Running this in React would show one wrong frame first, then snap to
         the saved choice — the "flash of wrong theme". It must be inline and
         synchronous. Light is the default; only an explicit saved choice can
         change it. */
      (function () {
        var c = 'light';
        try {
          var saved =
            localStorage.getItem('novelka.theme.v1') || localStorage.getItem('gridpress.theme.v1');
          if (saved === 'light' || saved === 'dark') c = saved;
        } catch (e) {
          /* private mode: stay on the dark default */
        }
        document.documentElement.setAttribute('data-theme', c);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
